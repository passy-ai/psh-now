name: PSH Notch

# Manual, because the app is not the server and they version separately: a dmg appears on
# the Releases tab built from exactly that commit, by a Mac, not by a laptop that may have
# uncommitted code on it.
on:
  push:
    tags: ["v*-notch"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the app and the dmg
        working-directory: tools/psh-notch
        run: ./package.sh

      - name: Check what was built
        working-directory: tools/psh-notch
        run: |
          file dist/PSHNotch.app/Contents/MacOS/PSHNotch
          ARCH=$(file dist/PSHNotch.app/Contents/MacOS/PSHNotch | grep -o 'arm64\|x86_64' | head -1)
          test "$ARCH" = "arm64" || { echo "built for $ARCH, expected arm64"; exit 1; }
          codesign --verify --strict dist/PSHNotch.app

      - name: Attach the dmg to the release
        uses: softprops/action-gh-release@v2
        with:
          files: tools/psh-notch/dist/psh-notch.dmg
          name: ${{ github.ref_name }}
          body: |
            **PSH Notch for macOS**

            Download `psh-notch.dmg`, open it, and drag **PSHNotch** into Applications.

            The app is signed ad hoc rather than with a paid Apple Developer
            certificate, so the first launch needs **right-click, Open** once. After
            that it starts normally.

            Requires an Apple Silicon Mac on macOS 13 or newer.
