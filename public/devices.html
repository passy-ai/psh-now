<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="psh.now" />
    <title>Devices - psh.now</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("psh.theme")||"dark"}catch(e){}</script>
  </head>
  <body>
    <header class="nav">
      <a class="nav-brand" href="/app"><img class="mark" src="/psh-mark.svg" alt="" /><span class="nav-brand-text">psh.now</span></a>
      <div class="nav-actions">
        <a href="/app" class="nav-link">Back to channels</a>
      </div>
    </header>

    <main class="wrap narrow">
      <div class="page-head">
        <div>
          <h1 class="page-title">Devices</h1>
          <p class="page-sub">Phones and tablets that can approve for this account.</p>
        </div>
        <button id="pairNew" class="btn pill"><span data-icon="qr"></span> Pair device</button>
      </div>

      <div id="pairBox" class="card hide">
        <div class="pair-head">
          <div>
            <div class="settings-head">Scan to pair</div>
            <p class="pair-hint">
              Open the camera on the phone and scan this code.
              <span id="pairExpiry" class="pair-expiry"></span>
            </p>
          </div>
          <button id="pairClose" class="icon-btn sm" aria-label="Close" data-icon="x"></button>
        </div>
        <img class="qr" id="pairQr" alt="Pairing QR" />
        <div class="settings-url">
          <code class="settings-link" id="pairUrl">-</code>
          <button id="pairCopy" class="btn sm">Copy link</button>
        </div>
      </div>

      <div id="deviceList" class="card"><div class="settings-empty">Loading…</div></div>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module">
      const $ = (id) => document.getElementById(id);

      /* ---------- icons (this page does not load app.js) ---------- */
      const ICONS = {
        qr: '<rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>',
        smartphone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
        tablet: '<rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
        monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      };
      const svg = (name, size = 16) =>
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
      const hydrateIcons = (root = document) => {
        for (const el of root.querySelectorAll("[data-icon]")) {
          el.innerHTML = svg(el.dataset.icon, Number(el.dataset.iconSize || 16));
        }
      };

      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      /* ---------- describing a device ---------- */

      /** Turn a user-agent into an icon kind and a "iOS 18.7, Safari" line. */
      function describe(ua) {
        const s = ua || "";
        const ipad = /iPad/.test(s) || (/Macintosh/.test(s) && /Mobile/.test(s));
        const iphone = /iPhone/.test(s);
        const android = /Android/.test(s);
        const tablet = ipad || (android && !/Mobile/.test(s));
        const kind = tablet ? "tablet" : iphone || (android && /Mobile/.test(s)) ? "smartphone" : "monitor";

        let system = "";
        if (iphone || ipad) {
          const m = s.match(/OS (\d+)[_.](\d+)/);
          system = m ? `iOS ${m[1]}.${m[2]}` : "iOS";
        } else if (/Android/.test(s)) {
          const m = s.match(/Android (\d+(?:\.\d+)?)/);
          system = m ? `Android ${m[1]}` : "Android";
        } else if (/Mac OS X/.test(s)) system = "macOS";
        else if (/Windows NT 10/.test(s)) system = "Windows";
        else if (/Linux/.test(s)) system = "Linux";

        let browser = "";
        const chrome = s.match(/Chrome\/(\d+)/);
        if (/HeadlessChrome/.test(s)) browser = "Headless Chrome";
        else if (/Edg\//.test(s)) browser = "Edge";
        else if (/OPR\//.test(s)) browser = "Opera";
        else if (/CriOS\//.test(s)) browser = "Chrome";
        else if (chrome) browser = `Chrome ${chrome[1]}`;
        else if (/Firefox\//.test(s)) browser = "Firefox";
        else {
          const v = s.match(/Version\/(\d+)(?:\.(\d+))?[^)]*Safari/);
          if (v) browser = `Safari ${v[1]}${v[2] ? `.${v[2]}` : ""}`;
          else if (/Safari/.test(s)) browser = "Safari";
        }

        return { kind, label: [system, browser].filter(Boolean).join(", ") };
      }

      /** 🇳🇱 NL - the country Cloudflare reported when the device paired. */
      const flag = (code) =>
        code.length === 2
          ? String.fromCodePoint(...[...code.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65))
          : "";

      const fmtAbs = (v) =>
        new Date(v).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

      function fmtRel(v) {
        const secs = Math.max(0, (Date.now() - new Date(v).getTime()) / 1000);
        if (secs < 90) return "just now";
        const mins = secs / 60;
        if (mins < 60) return `${Math.round(mins)} min ago`;
        const hours = mins / 60;
        if (hours < 24) return `${Math.round(hours)} h ago`;
        const days = hours / 24;
        if (days < 30) return `${Math.round(days)} d ago`;
        return fmtAbs(v);
      }

      /* ---------- page state ---------- */
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const key = (hash.get("key") || localStorage.getItem("psh.apiKey") || "").trim();

      const toast = (m) => {
        const el = $("toast");
        el.textContent = m;
        el.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove("show"), 2400);
      };

      async function api(path, { method = "GET", body } = {}) {
        const res = await fetch(path, {
          method,
          headers: { "Content-Type": "application/json", "x-psh-key": key },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
        return data;
      }

      if (!key) {
        $("deviceList").innerHTML =
          '<div class="settings-empty">Open this page from the app (sign in first).</div>';
        $("pairNew").classList.add("hide");
      }

      /* ---------- the device row ---------- */
      function row(d) {
        const info = describe(d.userAgent);
        const facts = [info.label].filter(Boolean);
        const where = d.country ? `${flag(d.country)} ${d.country}` : "";
        if (where || d.ip) facts.push([where, d.ip].filter(Boolean).join(" "));
        if (!d.country && !d.ip) facts.push('<span class="device-unknown">location not recorded</span>');

        const times = [`Connected ${fmtAbs(d.pairedAt)}`];
        if (d.lastSeenAt) {
          times.push(`<span title="${esc(fmtAbs(d.lastSeenAt))}">Last used ${fmtRel(d.lastSeenAt)}</span>`);
        } else {
          times.push("Never used yet");
        }

        return `<article class="device" data-id="${esc(d.id)}">
          <span class="device-icon" data-icon="${info.kind}"></span>
          <div class="device-body">
            <div class="device-top">
              <h3 class="device-name" data-rename="${esc(d.id)}" title="Double-click to rename">${esc(d.name)}</h3>
              <span class="device-state${d.online ? " on" : ""}">${d.online ? "Online" : "Paired"}</span>
            </div>
            <p class="device-facts">${facts.join(", ")}</p>
            <p class="device-times">${times.join(", ")}</p>
          </div>
          <button class="btn sm danger-ghost device-revoke" data-revoke="${esc(d.id)}">Revoke</button>
        </article>`;
      }

      async function load() {
        try {
          const { devices } = await api("/api/v1/devices");
          const live = (devices || []).filter((d) => !d.revokedAt);
          $("deviceList").innerHTML = live.length
            ? live.map(row).join("")
            : `<div class="settings-empty empty-state">
                 <span class="empty-mark" data-icon="smartphone"></span>
                 <p class="empty-title">No devices paired yet</p>
                 <p class="empty-copy">Pair a phone and you can approve from anywhere, even with the laptop shut.</p>
               </div>`;
          hydrateIcons($("deviceList"));
          wire();
        } catch (err) {
          $("deviceList").innerHTML = `<div class="settings-empty">${esc(err.message)}</div>`;
        }
      }

      /** Rename in place: double-click the name, Enter saves, Escape cancels. */
      function startRename(el, id) {
        const before = el.textContent;
        const input = document.createElement("input");
        input.className = "device-rename";
        input.value = before;
        input.setAttribute("aria-label", "Device name");
        el.replaceWith(input);
        input.focus();
        input.select();

        let finished = false;
        const finish = async (save) => {
          if (finished) return;
          finished = true;
          const name = input.value.trim().slice(0, 60);
          if (!save || !name || name === before) {
            load();
            return;
          }
          try {
            await api(`/api/v1/devices/${id}`, { method: "PATCH", body: { name } });
            toast("Renamed");
          } catch (err) {
            toast(err.message);
          }
          load();
        };

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") finish(true);
          else if (e.key === "Escape") finish(false);
        });
        input.addEventListener("blur", () => finish(true));
      }

      function wire() {
        for (const el of document.querySelectorAll("[data-rename]")) {
          el.addEventListener("dblclick", () => startRename(el, el.dataset.rename));
        }
        for (const b of document.querySelectorAll("[data-revoke]")) {
          b.onclick = async () => {
            if (!confirm("Revoke this device? It will stop receiving approvals.")) return;
            try {
              await api(`/api/v1/devices/${b.dataset.revoke}`, { method: "DELETE" });
              toast("Device revoked");
              load();
            } catch (err) {
              toast(err.message);
            }
          };
        }
      }

      /* ---------- pairing ---------- */
      async function showPairing() {
        try {
          const data = await api("/api/v1/devices/pairing", { method: "POST" });
          $("pairQr").src = `/api/v1/qr?data=${encodeURIComponent(data.url)}`;
          $("pairUrl").textContent = data.url;
          if (data.expiresAt) {
            const mins = Math.max(1, Math.round((new Date(data.expiresAt).getTime() - Date.now()) / 60000));
            $("pairExpiry").textContent = `The code expires in ${mins} min.`;
          }
          $("pairBox").classList.remove("hide");
          hydrateIcons($("pairBox"));
        } catch (err) {
          toast(err.message);
        }
      }

      $("pairNew")?.addEventListener("click", showPairing);
      $("pairClose")?.addEventListener("click", () => $("pairBox").classList.add("hide"));
      $("pairCopy")?.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText($("pairUrl").textContent);
          toast("Pairing link copied");
        } catch {
          toast("Copy failed");
        }
      });

      hydrateIcons();
      if (key) load();
    </script>
  </body>
</html>
