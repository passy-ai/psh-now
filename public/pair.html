<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Pair a device - psh.now</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="title">Checking link…</h1>
          <p class="page-sub" id="message">One moment.</p>
        </div>
      </div>

      <div class="card" id="pairCard" style="max-width: 420px">
        <div id="pairForm" class="hide">
          <label class="field-label" for="deviceName">Name this device</label>
          <input id="deviceName" class="field" placeholder="e.g. My iPhone" autocomplete="off" spellcheck="false" />
          <p class="form-hint">Only used to tell your devices apart when a request comes in.</p>
          <button id="pairBtn" class="btn primary block" style="margin-top: 14px">Pair this device</button>
        </div>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="/pair.js"></script>
  </body>
</html>
