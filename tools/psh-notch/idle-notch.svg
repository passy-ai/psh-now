<svg xmlns="http://www.w3.org/2000/svg" width="480" height="132" viewBox="0 0 480 132" role="img" aria-label="psh notch idle state: the notch with one grey dot">
  <rect width="480" height="132" fill="#ffffff"/>
  <!-- The notch itself: square against the top edge, rounded only underneath. That is what the
       hardware is - the cutout meets the menu bar in a straight line and turns the corner only
       where it meets the desktop - and it is what addBottomRounded draws in PSHNotch.swift. This
       was a <rect rx="15"> on a 30pt box, i.e. a pill rounded at both ends, which is not the
       notch. The bottom is a true semicircle: radius = half the 30pt height. -->
  <path d="M160 34 H320 V49 A15 15 0 0 1 305 64 H175 A15 15 0 0 1 160 49 Z" fill="#0b0b0c"/>
  <!-- the idle dot -->
  <circle cx="181" cy="49" r="4" fill="#8d8d93"/>
  <text x="240" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b6b70">psh notch, idle</text>
</svg>
